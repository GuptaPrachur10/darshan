<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef6f0">
  <title>ISKCON London Darshan Catalog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=15">
</head>
<body>

  <!-- Flower petals drifting down behind the content. Pure CSS, no JS. -->
  <div class="falling" aria-hidden="true">
    <span class="leaf c7" style="--x:3.1%; --d:16s; --delay:0s; --size:18px; --drift:-40px"><i></i></span>
    <span class="leaf c5" style="--x:6.9%; --d:10s; --delay:-4s; --size:13px; --drift:60px"><i></i></span>
    <span class="leaf c10" style="--x:10.6%; --d:16s; --delay:-13s; --size:16px; --drift:38px"><i></i></span>
    <span class="leaf c3" style="--x:15.7%; --d:11s; --delay:0s; --size:14px; --drift:43px"><i></i></span>
    <span class="leaf c2" style="--x:18.0%; --d:16s; --delay:-9s; --size:16px; --drift:66px"><i></i></span>
    <span class="leaf c6" style="--x:22.4%; --d:16s; --delay:-7s; --size:15px; --drift:-47px"><i></i></span>
    <span class="leaf c8" style="--x:28.5%; --d:12s; --delay:-11s; --size:15px; --drift:-43px"><i></i></span>
    <span class="leaf c11" style="--x:31.6%; --d:14s; --delay:-4s; --size:13px; --drift:-60px"><i></i></span>
    <span class="leaf c10" style="--x:36.5%; --d:17s; --delay:-2s; --size:15px; --drift:-56px"><i></i></span>
    <span class="leaf c2" style="--x:40.8%; --d:10s; --delay:-4s; --size:16px; --drift:37px"><i></i></span>
    <span class="leaf c12" style="--x:42.4%; --d:10s; --delay:-6s; --size:18px; --drift:65px"><i></i></span>
    <span class="leaf c1" style="--x:49.1%; --d:14s; --delay:-8s; --size:14px; --drift:-49px"><i></i></span>
    <span class="leaf c4" style="--x:50.6%; --d:11s; --delay:-9s; --size:17px; --drift:-42px"><i></i></span>
    <span class="leaf c9" style="--x:57.7%; --d:14s; --delay:-9s; --size:15px; --drift:-32px"><i></i></span>
    <span class="leaf c9" style="--x:61.9%; --d:15s; --delay:-10s; --size:15px; --drift:-54px"><i></i></span>
    <span class="leaf c11" style="--x:64.2%; --d:16s; --delay:-3s; --size:17px; --drift:57px"><i></i></span>
    <span class="leaf c1" style="--x:69.2%; --d:13s; --delay:-4s; --size:16px; --drift:63px"><i></i></span>
    <span class="leaf c3" style="--x:72.4%; --d:15s; --delay:0s; --size:16px; --drift:31px"><i></i></span>
    <span class="leaf c4" style="--x:76.8%; --d:12s; --delay:0s; --size:18px; --drift:59px"><i></i></span>
    <span class="leaf c12" style="--x:80.9%; --d:15s; --delay:-8s; --size:18px; --drift:31px"><i></i></span>
    <span class="leaf c5" style="--x:85.7%; --d:10s; --delay:-5s; --size:15px; --drift:49px"><i></i></span>
    <span class="leaf c6" style="--x:89.9%; --d:15s; --delay:-5s; --size:15px; --drift:-50px"><i></i></span>
    <span class="leaf c7" style="--x:94.6%; --d:14s; --delay:-4s; --size:16px; --drift:-31px"><i></i></span>
    <span class="leaf c8" style="--x:99.4%; --d:12s; --delay:-4s; --size:17px; --drift:-47px"><i></i></span>
  </div>

  <header class="header">
    <a href="#/" class="brand">
      <h1>ISKCON London</h1>
      <span class="brand-sub">Darshan Catalog</span>
    </a>
  </header>

  <main id="app" aria-live="polite">
    <p class="loading">Loading…</p>
  </main>

  <!-- Full-screen photo viewer with pinch / wheel / double-tap zoom. -->
  <div id="viewer" class="viewer" hidden>
    <div id="viewer-stage" class="viewer-stage">
      <img id="viewer-img" alt="" draggable="false">
    </div>
    <div class="viewer-bar">
      <button id="viewer-prev" type="button" aria-label="Previous photo">‹</button>
      <span id="viewer-info"></span>
      <button id="viewer-next" type="button" aria-label="Next photo">›</button>
      <button id="viewer-close" type="button" aria-label="Close">✕</button>
    </div>
  </div>

  <script src="app.js?v=10"></script>
</body>
</html>
