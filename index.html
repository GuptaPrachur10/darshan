<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef6f0">
  <title>ISKCON London Darshan Catalog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=14">
</head>
<body>

  <!-- Flower petals drifting down behind the content. Pure CSS, no JS. -->
  <div class="falling" aria-hidden="true">
    <span class="leaf r" style="--x:0.6%; --d:13s; --delay:0s; --size:8px; --drift:-62px"><i></i></span>
    <span class="leaf l" style="--x:8.1%; --d:11s; --delay:-11s; --size:11px; --drift:-48px"><i></i></span>
    <span class="leaf w" style="--x:10.0%; --d:13s; --delay:-11s; --size:11px; --drift:-47px"><i></i></span>
    <span class="leaf s" style="--x:17.4%; --d:16s; --delay:-8s; --size:10px; --drift:-42px"><i></i></span>
    <span class="leaf l" style="--x:21.1%; --d:10s; --delay:-6s; --size:8px; --drift:61px"><i></i></span>
    <span class="leaf l" style="--x:23.4%; --d:13s; --delay:-6s; --size:8px; --drift:-37px"><i></i></span>
    <span class="leaf p" style="--x:30.5%; --d:13s; --delay:-13s; --size:9px; --drift:30px"><i></i></span>
    <span class="leaf y" style="--x:35.6%; --d:12s; --delay:-8s; --size:8px; --drift:-66px"><i></i></span>
    <span class="leaf p" style="--x:38.6%; --d:13s; --delay:-6s; --size:8px; --drift:42px"><i></i></span>
    <span class="leaf y" style="--x:43.7%; --d:11s; --delay:-11s; --size:12px; --drift:-41px"><i></i></span>
    <span class="leaf y" style="--x:49.5%; --d:10s; --delay:0s; --size:10px; --drift:-47px"><i></i></span>
    <span class="leaf w" style="--x:53.2%; --d:10s; --delay:-1s; --size:11px; --drift:-40px"><i></i></span>
    <span class="leaf p" style="--x:57.3%; --d:10s; --delay:-5s; --size:12px; --drift:-52px"><i></i></span>
    <span class="leaf c" style="--x:59.9%; --d:15s; --delay:-14s; --size:9px; --drift:42px"><i></i></span>
    <span class="leaf w" style="--x:67.9%; --d:10s; --delay:-6s; --size:12px; --drift:30px"><i></i></span>
    <span class="leaf p" style="--x:70.3%; --d:13s; --delay:-3s; --size:11px; --drift:50px"><i></i></span>
    <span class="leaf r" style="--x:76.4%; --d:14s; --delay:-10s; --size:10px; --drift:-63px"><i></i></span>
    <span class="leaf c" style="--x:80.9%; --d:10s; --delay:-6s; --size:12px; --drift:61px"><i></i></span>
    <span class="leaf y" style="--x:83.7%; --d:13s; --delay:-9s; --size:8px; --drift:44px"><i></i></span>
    <span class="leaf c" style="--x:87.2%; --d:16s; --delay:-16s; --size:10px; --drift:38px"><i></i></span>
    <span class="leaf r" style="--x:94.1%; --d:12s; --delay:-11s; --size:10px; --drift:-33px"><i></i></span>
    <span class="leaf s" style="--x:99.8%; --d:12s; --delay:-4s; --size:9px; --drift:-68px"><i></i></span>
  </div>

  <header class="header">
    <a href="#/" class="brand">
      <h1>ISKCON London</h1>
      <span class="brand-sub">Darshan Catalog</span>
    </a>
  </header>

  <main id="app" aria-live="polite">
    <p class="loading">Loading…</p>
  </main>

  <!-- Full-screen photo viewer with pinch / wheel / double-tap zoom. -->
  <div id="viewer" class="viewer" hidden>
    <div id="viewer-stage" class="viewer-stage">
      <img id="viewer-img" alt="" draggable="false">
    </div>
    <div class="viewer-bar">
      <button id="viewer-prev" type="button" aria-label="Previous photo">‹</button>
      <span id="viewer-info"></span>
      <button id="viewer-next" type="button" aria-label="Next photo">›</button>
      <button id="viewer-close" type="button" aria-label="Close">✕</button>
    </div>
  </div>

  <script src="app.js?v=10"></script>
</body>
</html>
