<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f5f8">
  <title>ISKCON London Darshan Catalog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=12">
</head>
<body>
  <!-- Flowering branches in the top corners. -->
  <div class="branch branch-left" aria-hidden="true"></div>
  <div class="branch branch-right" aria-hidden="true"></div>

  <!-- Leaves and petals drifting down behind the content. Pure CSS, no JS. -->
  <div class="falling" aria-hidden="true">
    <span class="leaf p" style="--x:1.3%; --d:12s; --delay:-6s; --size:16px; --drift:-34px"><i></i></span>
    <span class="leaf a" style="--x:8.3%; --d:11s; --delay:-5s; --size:15px; --drift:-32px"><i></i></span>
    <span class="leaf w" style="--x:10.4%; --d:16s; --delay:-2s; --size:12px; --drift:-65px"><i></i></span>
    <span class="leaf l" style="--x:16.9%; --d:11s; --delay:-3s; --size:16px; --drift:-66px"><i></i></span>
    <span class="leaf p" style="--x:22.6%; --d:10s; --delay:-3s; --size:11px; --drift:-48px"><i></i></span>
    <span class="leaf y" style="--x:26.9%; --d:11s; --delay:-9s; --size:13px; --drift:-36px"><i></i></span>
    <span class="leaf b" style="--x:32.6%; --d:13s; --delay:-5s; --size:16px; --drift:-66px"><i></i></span>
    <span class="leaf p" style="--x:35.6%; --d:13s; --delay:-7s; --size:16px; --drift:50px"><i></i></span>
    <span class="leaf l" style="--x:42.3%; --d:17s; --delay:-11s; --size:13px; --drift:-41px"><i></i></span>
    <span class="leaf w" style="--x:48.3%; --d:13s; --delay:-1s; --size:15px; --drift:63px"><i></i></span>
    <span class="leaf a" style="--x:52.5%; --d:15s; --delay:-14s; --size:19px; --drift:-37px"><i></i></span>
    <span class="leaf p" style="--x:57.6%; --d:12s; --delay:-12s; --size:13px; --drift:-61px"><i></i></span>
    <span class="leaf y" style="--x:62.3%; --d:11s; --delay:-8s; --size:15px; --drift:51px"><i></i></span>
    <span class="leaf l" style="--x:68.5%; --d:17s; --delay:-14s; --size:11px; --drift:-47px"><i></i></span>
    <span class="leaf b" style="--x:72.6%; --d:11s; --delay:0s; --size:19px; --drift:48px"><i></i></span>
    <span class="leaf p" style="--x:78.7%; --d:15s; --delay:0s; --size:14px; --drift:40px"><i></i></span>
    <span class="leaf w" style="--x:83.3%; --d:17s; --delay:-1s; --size:12px; --drift:38px"><i></i></span>
    <span class="leaf a" style="--x:88.8%; --d:16s; --delay:-12s; --size:22px; --drift:-40px"><i></i></span>
    <span class="leaf l" style="--x:92.7%; --d:14s; --delay:-14s; --size:12px; --drift:65px"><i></i></span>
    <span class="leaf y" style="--x:97.1%; --d:16s; --delay:-11s; --size:16px; --drift:44px"><i></i></span>
  </div>

  <header class="header">
    <a href="#/" class="brand">
      <h1>ISKCON London</h1>
      <span class="brand-sub">Darshan Catalog</span>
    </a>
  </header>

  <main id="app" aria-live="polite">
    <p class="loading">Loading…</p>
  </main>

  <!-- Full-screen photo viewer with pinch / wheel / double-tap zoom. -->
  <div id="viewer" class="viewer" hidden>
    <div id="viewer-stage" class="viewer-stage">
      <img id="viewer-img" alt="" draggable="false">
    </div>
    <div class="viewer-bar">
      <button id="viewer-prev" type="button" aria-label="Previous photo">‹</button>
      <span id="viewer-info"></span>
      <button id="viewer-next" type="button" aria-label="Next photo">›</button>
      <button id="viewer-close" type="button" aria-label="Close">✕</button>
    </div>
  </div>

  <script src="app.js?v=10"></script>
</body>
</html>
