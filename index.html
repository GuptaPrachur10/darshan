<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf3e4">
  <title>ISKCON London Darshan Catalog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <header class="header">
    <a href="#/" class="brand">
      <span class="brand-sub">ISKCON London</span>
      <h1>Darshan Catalog</h1>
    </a>
    <div class="ornament" aria-hidden="true"><span>❀</span></div>
  </header>

  <main id="app" aria-live="polite">
    <p class="loading">Loading…</p>
  </main>

  <!-- Full-screen photo viewer with pinch / wheel / double-tap zoom. -->
  <div id="viewer" class="viewer" hidden>
    <div id="viewer-stage" class="viewer-stage">
      <img id="viewer-img" alt="" draggable="false">
    </div>
    <div class="viewer-bar">
      <button id="viewer-prev" type="button" aria-label="Previous photo">‹</button>
      <span id="viewer-info"></span>
      <button id="viewer-next" type="button" aria-label="Next photo">›</button>
      <button id="viewer-close" type="button" aria-label="Close">✕</button>
    </div>
  </div>

  <script src="app.js?v=7"></script>
</body>
</html>
