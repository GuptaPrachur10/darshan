<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef6f0">
  <title>ISKCON London Darshan Catalog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=13">
</head>
<body>
  <!-- Flowering branches in the top corners. -->
  <div class="branch branch-left" aria-hidden="true"></div>
  <div class="branch branch-right" aria-hidden="true"></div>

  <!-- Leaves and petals drifting down behind the content. Pure CSS, no JS. -->
  <div class="falling" aria-hidden="true">
    <span class="leaf a" style="--x:2.5%; --d:15s; --delay:0s; --size:22px; --drift:-33px"><i></i></span>
    <span class="leaf p" style="--x:8.7%; --d:11s; --delay:-5s; --size:14px; --drift:-54px"><i></i></span>
    <span class="leaf b" style="--x:12.3%; --d:13s; --delay:0s; --size:18px; --drift:47px"><i></i></span>
    <span class="leaf y" style="--x:15.9%; --d:16s; --delay:-5s; --size:11px; --drift:-69px"><i></i></span>
    <span class="leaf a" style="--x:22.7%; --d:12s; --delay:-2s; --size:15px; --drift:-43px"><i></i></span>
    <span class="leaf w" style="--x:28.4%; --d:12s; --delay:-2s; --size:13px; --drift:42px"><i></i></span>
    <span class="leaf l" style="--x:32.5%; --d:13s; --delay:-2s; --size:16px; --drift:-54px"><i></i></span>
    <span class="leaf b" style="--x:36.6%; --d:15s; --delay:-13s; --size:17px; --drift:-46px"><i></i></span>
    <span class="leaf p" style="--x:40.7%; --d:14s; --delay:-13s; --size:15px; --drift:-68px"><i></i></span>
    <span class="leaf a" style="--x:48.2%; --d:15s; --delay:-2s; --size:19px; --drift:49px"><i></i></span>
    <span class="leaf y" style="--x:52.4%; --d:15s; --delay:-5s; --size:14px; --drift:41px"><i></i></span>
    <span class="leaf b" style="--x:55.8%; --d:10s; --delay:-5s; --size:21px; --drift:-65px"><i></i></span>
    <span class="leaf w" style="--x:63.8%; --d:15s; --delay:-12s; --size:15px; --drift:-58px"><i></i></span>
    <span class="leaf a" style="--x:65.9%; --d:12s; --delay:-9s; --size:18px; --drift:-45px"><i></i></span>
    <span class="leaf p" style="--x:74.5%; --d:17s; --delay:-11s; --size:15px; --drift:63px"><i></i></span>
    <span class="leaf l" style="--x:76.8%; --d:17s; --delay:-3s; --size:15px; --drift:48px"><i></i></span>
    <span class="leaf b" style="--x:81.0%; --d:11s; --delay:-3s; --size:20px; --drift:39px"><i></i></span>
    <span class="leaf a" style="--x:87.3%; --d:11s; --delay:-4s; --size:20px; --drift:41px"><i></i></span>
    <span class="leaf y" style="--x:94.1%; --d:12s; --delay:-11s; --size:16px; --drift:60px"><i></i></span>
    <span class="leaf p" style="--x:96.6%; --d:10s; --delay:-1s; --size:15px; --drift:32px"><i></i></span>
  </div>

  <header class="header">
    <a href="#/" class="brand">
      <h1>ISKCON London</h1>
      <span class="brand-sub">Darshan Catalog</span>
    </a>
  </header>

  <main id="app" aria-live="polite">
    <p class="loading">Loading…</p>
  </main>

  <!-- Full-screen photo viewer with pinch / wheel / double-tap zoom. -->
  <div id="viewer" class="viewer" hidden>
    <div id="viewer-stage" class="viewer-stage">
      <img id="viewer-img" alt="" draggable="false">
    </div>
    <div class="viewer-bar">
      <button id="viewer-prev" type="button" aria-label="Previous photo">‹</button>
      <span id="viewer-info"></span>
      <button id="viewer-next" type="button" aria-label="Next photo">›</button>
      <button id="viewer-close" type="button" aria-label="Close">✕</button>
    </div>
  </div>

  <script src="app.js?v=10"></script>
</body>
</html>
